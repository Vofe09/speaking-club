<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Question Card</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --card-1: rgba(255, 255, 255, 0.14);
      --card-2: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --accent: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #1e293b 0%, transparent 42%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      padding: 24px;
      user-select: none;
    }

    .title {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      letter-spacing: 0.02em;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .scene {
      width: min(92vw, 460px);
      height: min(64vh, 440px);
      perspective: 1600px;
      cursor: pointer;
      outline: none;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 950ms cubic-bezier(0.2, 0.85, 0.2, 1);
      filter: drop-shadow(0 28px 58px var(--shadow));
      will-change: transform;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--border);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 30px;
      background:
        linear-gradient(145deg, var(--card-1), var(--card-2));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform-style: preserve-3d;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.32), transparent 36%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 34%);
    }

    .face::after {
      content: "";
      position: absolute;
      inset: -40%;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        transparent 42%,
        rgba(255, 255, 255, 0.14) 50%,
        transparent 58%
      );
      transform: translateX(-40%) rotate(12deg);
      animation: shine 7s linear infinite;
    }

    @keyframes shine {
      0%   { transform: translateX(-50%) rotate(12deg); }
      100% { transform: translateX(50%) rotate(12deg); }
    }

    .front {
      transform: rotateY(0deg);
    }

    .back {
      transform: rotateY(180deg);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: grid;
      gap: 18px;
      justify-items: center;
      transform: translateZ(40px);
    }

    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .question {
      font-size: clamp(26px, 4.2vw, 40px);
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-wrap: balance;
      max-width: 17ch;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      z-index: 1;
    }

    .pulse {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.42);
      transform: translate(-50%, -50%);
      animation: ripple 1.8s ease-out infinite;
      pointer-events: none;
    }

    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.30);
        opacity: 1;
      }
      100% {
        box-shadow: 0 0 0 34px rgba(56, 189, 248, 0);
        opacity: 0;
      }
    }

    .footer {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.42);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .scene {
        width: 92vw;
        height: 58vh;
      }

      .face {
        border-radius: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">
      <h1>Random Question Card</h1>
      <p>Нажми на карточку — она перевернётся и покажет новый вопрос</p>
    </div>

    <div class="scene" id="scene" tabindex="0" aria-label="Карточка с вопросами">
      <div class="card" id="card">
        <div class="face front">
          <div class="content">
            <div class="badge">Question</div>
            <div class="question" id="frontQuestion">Нажми, чтобы начать</div>
          </div>
        </div>

        <div class="face back">
          <div class="content">
            <div class="badge">Question</div>
            <div class="question" id="backQuestion">...</div>
          </div>
        </div>
      </div>

      <div class="pulse"></div>
      <div class="hint">Click or tap</div>
    </div>

    <div class="footer">3D flip animation</div>
  </div>

  <script>
const Questions = [
  "What is the luckiest thing that has ever happened to you by accident?",
  "Tell us about a moment when you completely misunderstood a situation.",
  "Have you ever been in the right place at exactly the right time?",
  "What is something that happened only because you decided not to stay home?",
  "Tell us about a time when you trusted your intuition and it turned out to be right.",
  "Have you ever changed someone else’s day without realizing it?",
  "What’s the strangest coincidence you’ve ever experienced?",
  "Tell us about a moment that seemed ordinary but later became very important.",
  "Have you ever met someone for only a few minutes but remembered them for years?",
  "What’s the best surprise life has ever given you?",
  "What is the funniest argument you’ve ever had?",
  "Who knows you better than anyone else? What makes them so good at understanding you?",
  "Tell us about a friendship that started in an unusual way.",
  "Have you ever become friends with someone you didn’t like at first?",
  "What’s something you’ve forgiven but never forgotten?",
  "Tell us about a conversation that changed your relationship with someone.",
  "What’s the kindest thing a stranger has ever done for you?",
  "Have you ever helped someone and later realized they had helped you even more?",
  "What’s the most difficult goodbye you’ve ever had?",
  "Tell us about someone you wish you had thanked properly.",
  "What small thing instantly improves your mood?",
  "What’s something most people enjoy that you simply don’t understand?",
  "What simple activity makes you lose track of time?",
  "What’s a smell that immediately brings back memories?",
  "If someone wanted to understand your personality through one object, what would you show them?",
  "What’s something you’ve never gotten tired of doing?",
  "What’s one thing you’re surprisingly passionate about?",
  "What habit would be hardest for you to give up?",
  "What’s something you appreciate much more now than you did five years ago?",
  "What’s your favorite kind of day from beginning to end?",
  "What game did you spend hours playing as a child?",
  "What’s something adults told you that turned out not to be true?",
  "Who was your childhood hero, and why?",
  "What was your biggest dream when you were ten years old?",
  "Tell us about a rule you hated as a child but understand now.",
  "What’s the bravest thing you remember doing as a kid?",
  "What family tradition do you still remember most clearly?",
  "Did you ever have an imaginary world or imaginary friend?",
  "What’s something children today will probably never experience?",
  "What’s a toy or object from your childhood that meant a lot to you?",
  "Tell us about a time when you almost gave up but didn’t.",
  "What’s something difficult that was definitely worth doing?",
  "Have you ever had to make a decision with very little information?",
  "What’s the hardest promise you’ve ever kept?",
  "Tell us about a situation where patience solved the problem.",
  "Have you ever had to admit that someone else was right?",
  "What’s one challenge you hope you’ll never have to face again?",
  "Tell us about a responsibility that taught you an important lesson.",
  "Have you ever done something difficult simply because nobody else would?",
  "What’s something you accomplished that once seemed impossible?",
  "What’s a popular opinion you completely disagree with?",
  "What advice do people give too often?",
  "What’s something people worry about far more than they should?",
  "If you could remove one social rule, what would it be?",
  "What’s something society should value more?",
  "Do people become wiser with age, or just older? Why?",
  "What’s more important: talent or consistency?",
  "Should people always tell the truth, even when it hurts?",
  "What’s one lesson schools should teach but usually don’t?",
  "What’s a belief you’ve changed your mind about in recent years?",
  "If your life had chapter titles, what would this chapter be called?",
"If your personality were a season, which one would it be?",
  "If your life were a movie, what scene would definitely be included?",
  "If memories could be stored in bottles, which one would you keep forever?",
  "If tomorrow had no consequences, what would you do?",
  "If your future self could leave you one sentence, what do you hope it would say?",
  "If you could experience one day from someone else’s life, whose would it be?",
  "If your favorite place could talk, what would it say about you?",
  "If someone wrote a book about your life, what would the title be?",
  "If your biggest challenge became your greatest strength, how would your life change?",
  "What’s one moment you wish you had appreciated more while it was happening?",
  "What’s something you’ve learned the hard way?",
  "When was the last time you felt genuinely proud of yourself?",
  "What’s one thing you’ve done that required more courage than people realize?",
  "What experience made you much more grateful?",
  "Tell us about a time when slowing down was the right decision.",
  "What’s one question you’ve never found a good answer to?",
  "If someone asked you, 'What kind of person are you?' what story would you tell instead of giving adjectives?",
  "What’s one memory that perfectly represents who you are today?",
  "Looking back, what unexpected event had the biggest positive impact on your life?"
];

    const scene = document.getElementById("scene");
    const card = document.getElementById("card");
    const frontQuestion = document.getElementById("frontQuestion");
    const backQuestion = document.getElementById("backQuestion");

    let UnusedQuestions = [...Questions];
    let IsFlipped = false;
    let IsLocked = false;

    function GetRandomQuestion() {
      if (UnusedQuestions.length === 0) {
        UnusedQuestions = [...Questions];
      }

      const RandomIndex = Math.floor(Math.random() * UnusedQuestions.length);
      const [SelectedQuestion] = UnusedQuestions.splice(RandomIndex, 1);
      return SelectedQuestion;
    }

    function FlipCard() {
      if (IsLocked) return;
      IsLocked = true;

      if (IsFlipped) {
        frontQuestion.textContent = GetRandomQuestion();
      } else {
        backQuestion.textContent = GetRandomQuestion();
      }

      card.classList.toggle("is-flipped");
      IsFlipped = !IsFlipped;

      window.setTimeout(() => {
        IsLocked = false;
      }, 950);
    }

    scene.addEventListener("click", FlipCard);

    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        FlipCard();
      }
    });

    backQuestion.textContent = GetRandomQuestion();
  </script>
</body>
</html>
