<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Question Card</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --card-1: rgba(255, 255, 255, 0.14);
      --card-2: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.18);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --accent: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #1e293b 0%, transparent 42%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      padding: 24px;
      user-select: none;
    }

    .title {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      letter-spacing: 0.02em;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .scene {
      width: min(92vw, 460px);
      height: min(64vh, 440px);
      perspective: 1600px;
      cursor: pointer;
      outline: none;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 950ms cubic-bezier(0.2, 0.85, 0.2, 1);
      filter: drop-shadow(0 28px 58px var(--shadow));
      will-change: transform;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--border);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 30px;
      background:
        linear-gradient(145deg, var(--card-1), var(--card-2));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform-style: preserve-3d;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.32), transparent 36%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 34%);
    }

    .face::after {
      content: "";
      position: absolute;
      inset: -40%;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        transparent 42%,
        rgba(255, 255, 255, 0.14) 50%,
        transparent 58%
      );
      transform: translateX(-40%) rotate(12deg);
      animation: shine 7s linear infinite;
    }

    @keyframes shine {
      0%   { transform: translateX(-50%) rotate(12deg); }
      100% { transform: translateX(50%) rotate(12deg); }
    }

    .front {
      transform: rotateY(0deg);
    }

    .back {
      transform: rotateY(180deg);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: grid;
      gap: 18px;
      justify-items: center;
      transform: translateZ(40px);
    }

    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .question {
      font-size: clamp(26px, 4.2vw, 40px);
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-wrap: balance;
      max-width: 17ch;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 13px;
      z-index: 1;
    }

    .pulse {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.42);
      transform: translate(-50%, -50%);
      animation: ripple 1.8s ease-out infinite;
      pointer-events: none;
    }

    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.30);
        opacity: 1;
      }
      100% {
        box-shadow: 0 0 0 34px rgba(56, 189, 248, 0);
        opacity: 0;
      }
    }

    .footer {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.42);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      .scene {
        width: 92vw;
        height: 58vh;
      }

      .face {
        border-radius: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">
      <h1>Random Question Card</h1>
      <p>Нажми на карточку — она перевернётся и покажет новый вопрос</p>
    </div>

    <div class="scene" id="scene" tabindex="0" aria-label="Карточка с вопросами">
      <div class="card" id="card">
        <div class="face front">
          <div class="content">
            <div class="badge">Question</div>
            <div class="question" id="frontQuestion">Нажми, чтобы начать</div>
          </div>
        </div>

        <div class="face back">
          <div class="content">
            <div class="badge">Question</div>
            <div class="question" id="backQuestion">...</div>
          </div>
        </div>
      </div>

      <div class="pulse"></div>
      <div class="hint">Click or tap</div>
    </div>

    <div class="footer">3D flip animation</div>
  </div>

  <script>
const Questions = [
  "What is the most embarrassing thing that has ever happened to you in public?",
  "Have you ever laughed at the wrong moment and couldn’t stop? What happened?",
  "What is a mistake you made that still makes you smile when you remember it?",
  "Tell us about a time when you tried to look confident but failed completely.",
  "What is the funniest misunderstanding you have ever had with another person?",
  "Have you ever sent a message to the wrong person? What happened next?",
  "What is the most awkward silence you have ever experienced?",
  "Tell us about a time when you were sure something would be easy, but it turned into chaos.",
  "What is a childhood memory that is funny now, but was serious at the time?",
  "Have you ever done something clumsy in front of people you wanted to impress?",
  "What is one decision that changed the direction of your life?",
  "Tell us about a moment when you realized you had grown up.",
  "What is a mistake that taught you an important lesson?",
  "Have you ever failed at something and later realized it was useful?",
  "What is one experience that made you more confident?",
  "Tell us about a time when your plan collapsed, but the result was better than expected.",
  "What is something you used to worry about too much, but not anymore?",
  "Have you ever changed your mind about something very important? Why?",
  "What is one challenge that made you stronger than before?",
  "Tell us about a moment when you understood what really matters to you.",
  "Who has had the biggest influence on your personality?",
  "Tell us about someone who believed in you before you believed in yourself.",
  "What is one habit or value you picked up from your family?",
  "Have you ever met someone who completely changed your opinion about a topic?",
  "What is the best advice you have ever received from another person?",
  "Tell us about a teacher, friend, or relative who left a strong mark on your life.",
  "Has anyone ever disappointed you in a way that taught you something important?",
  "What is one thing you admire most in another person and try to copy?",
  "Tell us about a person who made a difficult time easier for you.",
  "Have you ever been inspired by someone you barely knew? How?",
  "What is the most surprising thing that ever happened to you while traveling?",
  "Tell us about a trip that did not go as planned.",
  "Have you ever gotten lost somewhere and found something memorable?",
  "What is the best place you have ever visited, and why did it stay in your memory?",
  "Tell us about a time when a journey mattered more than the destination.",
  "Have you ever experienced a cultural difference that shocked or amused you?",
  "What is the most interesting stranger you have met while away from home?",
  "Tell us about a time when a bad travel experience turned into a good story.",
  "Have you ever discovered a new place that felt strangely familiar?",
  "What is one small detail from a trip that you still remember clearly?",
  "What is the hardest thing you have ever had to learn for school or work?",
  "Tell us about a time when you were under pressure and had to act fast.",
  "Have you ever worked on something important with a difficult team? What was it like?",
  "What is one school or work experience that made you realize your strengths?",
  "Tell us about a time when you had to take responsibility for a mistake.",
  "Have you ever had a teacher, boss, or supervisor who challenged you in a good way?",
  "What is a project or task you were proud of, even if nobody noticed it?",
  "Tell us about a time when you learned more from failure than from success.",
  "Have you ever had to deal with a difficult deadline? How did you handle it?",
  "What is one skill you learned because it became necessary, not because you wanted it?",
  "What is something you used to dislike about yourself but now see differently?",
  "Tell us about a moment when you discovered a hidden strength.",
  "What is one fear you have slowly overcome over time?",
  "Have you ever surprised yourself with how brave, kind, or patient you were?",
  "What is a part of your personality that people often misunderstand?",
  "Tell us about a time when being yourself worked better than pretending.",
  "What is one belief you hold that has stayed with you for years?",
  "Have you ever realized that you are more like one of your parents than you thought?",
  "What is something you learned about yourself through a difficult period?",
  "Tell us about a time when you changed as a person in a way others noticed.",
  "What is one dream you had that you still think about?",
  "If you could relive one day from your life, which day would you choose and why?",
  "Tell us about something you once wanted very badly but no longer want.",
  "What is one choice you made that you would make again without hesitation?",
  "If your younger self could see your life now, what would surprise them most?",
  "Tell us about a time when you followed your instinct instead of advice.",
  "What is one thing you hope people will remember about you?",
  "Have you ever taken a risk that felt scary but worth it?",
  "What is one 'what if' question about your own life that you still wonder about?",
  "If you had to start a completely new life tomorrow, what part of your current life would you keep?"
];

    const scene = document.getElementById("scene");
    const card = document.getElementById("card");
    const frontQuestion = document.getElementById("frontQuestion");
    const backQuestion = document.getElementById("backQuestion");

    let UnusedQuestions = [...Questions];
    let IsFlipped = false;
    let IsLocked = false;

    function GetRandomQuestion() {
      if (UnusedQuestions.length === 0) {
        UnusedQuestions = [...Questions];
      }

      const RandomIndex = Math.floor(Math.random() * UnusedQuestions.length);
      const [SelectedQuestion] = UnusedQuestions.splice(RandomIndex, 1);
      return SelectedQuestion;
    }

    function FlipCard() {
      if (IsLocked) return;
      IsLocked = true;

      if (IsFlipped) {
        frontQuestion.textContent = GetRandomQuestion();
      } else {
        backQuestion.textContent = GetRandomQuestion();
      }

      card.classList.toggle("is-flipped");
      IsFlipped = !IsFlipped;

      window.setTimeout(() => {
        IsLocked = false;
      }, 950);
    }

    scene.addEventListener("click", FlipCard);

    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        FlipCard();
      }
    });

    backQuestion.textContent = GetRandomQuestion();
  </script>
</body>
</html>
