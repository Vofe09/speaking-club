<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Question Card</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #111827;
      --card1: rgba(255, 255, 255, 0.12);
      --card2: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.7);
      --accent: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #1e293b 0%, transparent 45%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
    }

    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 40px);
      letter-spacing: 0.02em;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card-scene {
      width: min(92vw, 440px);
      height: min(62vh, 420px);
      perspective: 1400px;
      cursor: pointer;
      outline: none;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.2, 0.9, 0.2, 1);
      filter: drop-shadow(0 24px 50px var(--shadow));
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      backface-visibility: hidden;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background:
        linear-gradient(145deg, var(--card1), var(--card2));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.22), transparent 32%);
      pointer-events: none;
    }

    .front {
      text-align: center;
    }

    .back {
      transform: rotateY(180deg);
    }

    .question {
      position: relative;
      z-index: 1;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
      max-width: 18ch;
      text-wrap: balance;
    }

    .front .question {
      opacity: 0.95;
    }

    .label {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .pulse {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      transform: translate(-50%, -50%);
      animation: ripple 1.8s infinite ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.34);
        opacity: 1;
      }
      100% {
        box-shadow: 0 0 0 30px rgba(56, 189, 248, 0);
        opacity: 0;
      }
    }

    .footer {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.45);
      font-size: 12px;
    }

    .shake {
      animation: shake 0.55s ease;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20% { transform: rotateY(180deg) translateX(-3px); }
      40% { transform: rotateY(180deg) translateX(3px); }
      60% { transform: rotateY(180deg) translateX(-2px); }
      80% { transform: rotateY(180deg) translateX(2px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">
      <h1>Random Question Card</h1>
      <p>Нажми на карточку, чтобы перевернуть её и получить новый вопрос</p>
    </div>

    <div class="card-scene" id="cardScene" tabindex="0" aria-label="Карточка с вопросом">
      <div class="card" id="card">
        <div class="face front">
          <div class="question" id="frontText">Нажми, чтобы начать</div>
          <div class="label">Tap to reveal</div>
        </div>
        <div class="face back">
          <div class="question" id="backText">Какой вопрос будет следующим?</div>
          <div class="label">Next question</div>
        </div>
      </div>
      <div class="pulse"></div>
    </div>

    <div class="footer">Click / tap anywhere on the card</div>
  </div>

  <script>
    const questions = [
      "Что бы ты сделал(а), если бы у тебя был один свободный год?",
      "Какой навык изменил бы твою жизнь сильнее всего?",
      "Кого из людей ты бы хотел(а) пригласить на ужин?",
      "Что для тебя важнее: свобода или стабильность?",
      "Какой момент ты бы хотел(а) прожить еще раз?",
      "Что тебя сильнее всего мотивирует?",
      "Если бы можно было убрать один страх, что бы это было?",
      "Какую привычку ты считаешь самой полезной?",
      "Что ты бы делал(а), если бы никто не оценивал результат?",
      "Какой совет ты бы дал(а) себе 5 лет назад?"
    ];

    const cardScene = document.getElementById("cardScene");
    const card = document.getElementById("card");
    const frontText = document.getElementById("frontText");
    const backText = document.getElementById("backText");

    let unusedQuestions = [...questions];
    let isFlipped = false;
    let isAnimating = false;
    let currentQuestion = "Нажми, чтобы начать";

    function getRandomQuestion() {
      if (unusedQuestions.length === 0) {
        unusedQuestions = [...questions];
      }

      const randomIndex = Math.floor(Math.random() * unusedQuestions.length);
      const [selectedQuestion] = unusedQuestions.splice(randomIndex, 1);
      return selectedQuestion;
    }

    function nextQuestion() {
      return getRandomQuestion();
    }

    function flipCard() {
      if (isAnimating) return;

      isAnimating = true;
      card.classList.add("shake");

      if (!isFlipped) {
        const newQuestion = nextQuestion();
        backText.textContent = newQuestion;
        currentQuestion = newQuestion;
      } else {
        const newQuestion = nextQuestion();
        frontText.textContent = newQuestion;
        currentQuestion = newQuestion;
      }

      card.classList.toggle("flipped");
      isFlipped = !isFlipped;

      setTimeout(() => {
        card.classList.remove("shake");
        isAnimating = false;
      }, 600);
    }

    cardScene.addEventListener("click", flipCard);

    cardScene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });

    // Инициализация первого вопроса на обратной стороне
    backText.textContent = nextQuestion();
    currentQuestion = backText.textContent;
  </script>
</body>
</html>
